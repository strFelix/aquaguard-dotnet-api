services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env before starting Compose}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env before starting Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting Compose}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aquaguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: AquaGuard.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:?Copy .env.example to .env before starting Compose};Username=${POSTGRES_USER:?Copy .env.example to .env before starting Compose};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env before starting Compose}
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?Copy .env.example to .env before starting Compose}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aquaguard

volumes:
  postgres_data:

networks:
  aquaguard:
