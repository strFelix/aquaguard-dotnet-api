# Deploy staging after compiling and passing the automated tests on hml.
name: Build and deploy ASP.Net Core app to Azure Web App - AquaGuardAPI-staging

on:
  push:
    branches:
      - hml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build AquaGuard.sln --configuration Release

      - name: Test
        run: dotnet test AquaGuard.sln --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish AquaGuard.API/AquaGuard.API.csproj --configuration Release --no-build --output "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: staging-app
          path: ${{env.DOTNET_ROOT}}/myapp

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file AquaGuard.API/Dockerfile --tag aquaguard-api:${{ github.sha }} .

  deploy:
    runs-on: windows-latest
    needs:
      - build
      - container-build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: staging-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D69C47B9291147E3B56A9853B2C8934E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53D56BCA691B49F3A8F0D18EF90FF160 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28FCF566D108410A92CA9AEB72793FF7 }}

      - name: Deploy to staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: AquaGuardAPI-staging
          slot-name: Production
          package: .

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check staging health
        run: |
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://aquaguardapi-staging-e7aeezcqatemaght.canadacentral-01.azurewebsites.net/health)"
          test "$response" = "Healthy"
