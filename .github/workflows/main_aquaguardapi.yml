# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - AquaGuardAPI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test AquaGuard.sln --configuration Release --no-build --no-restore

      - name: dotnet publish
        run: dotnet publish AquaGuard.API/AquaGuard.API.csproj --configuration Release --no-build --output "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file AquaGuard.API/Dockerfile --tag aquaguard-api:${{ github.sha }} .

  deploy:
    runs-on: windows-latest
    needs:
      - build
      - container-build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC5B98B149C94D159ADD8D4052613083 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1CE2F9B944354CAE816BCC0AD3FE3753 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04CB7C3574E54FE882F1E132B28F7769 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AquaGuardAPI'
          slot-name: 'Production'
          package: .

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check production health
        run: |
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://aquaguardapi-evh6dzbvg4b8d7cd.canadacentral-01.azurewebsites.net/health)"
          test "$response" = "Healthy"
          